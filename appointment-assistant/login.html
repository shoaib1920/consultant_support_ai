<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Appointment Assistant</title>
  <style>
    :root { --ink: #13233f; --muted: #5b6b82; --line: #e4e9f0; --blue: #2f6fed; --bg: #f4f6fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; padding: 16px; }
    .card { width: 100%; max-width: 380px; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 18px 50px rgba(15,23,36,.10); overflow: hidden; }
    .top { background: #0f1724; color: #fff; padding: 18px 22px; }
    .top strong { font-size: 18px; }
    .top .sub { color: #aebdd4; font-size: 12px; margin-top: 2px; }
    form { padding: 20px 22px 8px; display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 5px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; font: inherit; }
    input:focus { outline: 2px solid #c7d7ff; border-color: var(--blue); }
    button.primary { width: 100%; padding: 11px; border: none; border-radius: 9px; background: var(--blue); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button.primary:disabled { opacity: .6; cursor: default; }
    .link { background: none; border: none; color: var(--blue); font: inherit; cursor: pointer; padding: 0; align-self: flex-start; }
    .msg { margin: 4px 22px 18px; font-size: 13px; padding: 9px 11px; border-radius: 9px; display: none; }
    .msg.err { display: block; background: #fdecec; color: #a12; border: 1px solid #f3c9c9; }
    .msg.ok { display: block; background: #e8f6ee; color: #176b3f; border: 1px solid #bfe4cd; }
    .foot { padding: 0 22px 18px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top"><strong>Appointment Assistant</strong><div class="sub">Sign in to continue</div></div>
    <form id="form">
      <div>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required />
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="primary" id="submit" type="submit">Sign in</button>
      <button class="link" id="forgot" type="button">Forgot password?</button>
    </form>
    <div class="msg" id="msg"></div>
    <div class="foot">Accounts are created by your provider. No public sign-up.</div>
  </div>

  <script src="vendor/firebase-app-compat.js"></script>
  <script src="vendor/firebase-auth-compat.js"></script>
  <script src="vendor/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="core.js"></script>
  <script src="firebase-glue.js"></script>
  <script src="login.js"></script>
</body>
</html>
